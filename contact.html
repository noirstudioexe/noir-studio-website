
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Noir Studio</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .contact-page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 80px 24px;
            box-sizing: border-box;
            background: #080808;
            color: #eeeeee;
            text-align: center;
            font-family: Arial, Helvetica, sans-serif;
        }

        .contact-page h1 {
            font-size: clamp(32px, 5vw, 52px);
            font-weight: 300;
            letter-spacing: 9px;
            margin: 0 0 26px;
        }

        .contact-page .subtitle {
            color: #aaaaaa;
            font-size: 13px;
            letter-spacing: 4px;
            margin: 0 0 45px;
        }

        .contact-actions {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 16px;
        }

        .contact-actions a {
            display: inline-block;
            min-width: 155px;
            padding: 16px 25px;
            border: 1px solid #777777;
            color: #eeeeee;
            background: transparent;
            text-decoration: none;
            font-size: 11px;
            letter-spacing: 2px;
            transition: background 0.3s ease, color 0.3s ease;
        }

        .contact-actions a:hover {
            background: #eeeeee;
            color: #080808;
        }

        .contact-back {
            margin-top: 70px;
            color: #888888;
            text-decoration: none;
            font-size: 11px;
            letter-spacing: 2px;
        }

        .contact-back:hover {
            color: #ffffff;
        }
    </style>
</head>

<body>
    <main class="contact-page">
        <h1>CONTACT</h1>
        <p class="subtitle">LET'S WORK TOGETHER.</p>

        <div class="contact-actions">
            <a href="mailto:samar.logica@gmail.com">
                EMAIL ME
            </a>
            
<a href="https://discord.gg/GbGYQtaXxz" target="_blank" rel="noopener noreferrer">
    DISCORD
</a>
        </div>

        <a href="index.html" class="contact-back">
            BACK TO HOME
        </a>
    </main>

</body>
</html>
